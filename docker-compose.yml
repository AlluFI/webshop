services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voltco
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voltco"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "10250:1025"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_ERLANG_COOKIE: voltco-dev-cookie
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      # Persist queues only. Mounting all of /var/lib/rabbitmq puts .erlang.cookie
      # on the volume as root (400) and RabbitMQ then fails with eacces.
      - rabbitmq_data:/var/lib/rabbitmq/mnesia
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: i-love-shopping3-api
    pull_policy: build
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/voltco?schema=public
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_jwt_access_secret_change_me_32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_must_be_32_chars_min}
      JWT_ACCESS_EXPIRES_SEC: "900"
      JWT_REFRESH_EXPIRES_SEC: "604800"
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: Volt & Co <no-reply@localhost>
      WEB_APP_URL: http://localhost:8088
      OAUTH_CALLBACK_BASE: http://localhost:3000/api/v1/auth
      # Google, Stripe, and DATA_ENCRYPTION_KEY come from env_file (.env).
      # Do not map ${VAR:-} here: an empty interpolation overwrites the file.
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET:-6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe}
      COOKIE_SECURE: "false"
      PORT: "3000"
      UPLOAD_DIR: /data/uploads
      POSTI_MODE: ${POSTI_MODE:-mock}
      POSTI_CLIENT_ID: ${POSTI_CLIENT_ID:-}
      POSTI_CLIENT_SECRET: ${POSTI_CLIENT_SECRET:-}
      POSTNORD_MODE: ${POSTNORD_MODE:-mock}
      POSTNORD_CLIENT_ID: ${POSTNORD_CLIENT_ID:-}
      POSTNORD_CLIENT_SECRET: ${POSTNORD_CLIENT_SECRET:-}
      BUDBEE_MODE: ${BUDBEE_MODE:-mock}
      BUDBEE_API_KEY: ${BUDBEE_API_KEY:-}
      BUDBEE_API_SECRET: ${BUDBEE_API_SECRET:-}
      BUDBEE_BASE_URL: ${BUDBEE_BASE_URL:-https://api.staging.budbee.com}
      BUDBEE_COLLECTION_ID: ${BUDBEE_COLLECTION_ID:-0}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "3000:3000"

  worker:
    image: i-love-shopping3-api
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    pull_policy: build
    command: ["node", "dist/worker.js"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/voltco?schema=public
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_jwt_access_secret_change_me_32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_must_be_32_chars_min}
      JWT_ACCESS_EXPIRES_SEC: "900"
      JWT_REFRESH_EXPIRES_SEC: "604800"
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: Volt & Co <no-reply@localhost>
      WEB_APP_URL: http://localhost:8088
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
      mailpit:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/storefront.Dockerfile
      args:
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI}
    environment:
      API_PROXY_TARGET: http://api:3000
      API_INTERNAL_URL: http://api:3000/api/v1
      NEXT_PUBLIC_API_BASE: /api/v1
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI}
    depends_on:
      - api
    ports:
      - "8088:3000"

  tls:
    build:
      context: ./nginx
    depends_on:
      - web
    ports:
      - "8443:443"

  k6:
    image: grafana/k6:latest
    profiles: ["load"]
    volumes:
      - ./load-tests:/scripts
    environment:
      BASE_URL: http://web:3000
      K6_PROFILE: ${K6_PROFILE:-review}
    command: ["run", "/scripts/shop.js"]
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  uploads_data:
  rabbitmq_data:
